name: checks

on:
  push:
    paths: ['enclave/**', 'contract/**', 'spike/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/enclave.yml']
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '50.0.0'

      - name: Unit tests
        run: cargo test --locked

      - name: Build the WASI P2 module
        run: |
          cargo build --locked --release --target wasm32-wasip2
          sha256sum target/wasm32-wasip2/release/jurat-enclave.wasm | tee wasm.sha256

      # The module runs outside OutLayer here, against live 1Click mainnet,
      # with throwaway keys that hold nothing.
      - name: Run against 1Click
        run: |
          WASM=target/wasm32-wasip2/release/jurat-enclave.wasm
          run() { node spike/local/make-request.mjs "$@" | wasmtime run -S http "$WASM"; }

          ok=$(run nep141:wrap.near 0);       echo "threshold 0: $ok"
          low=$(run nep141:wrap.near 1);      echo "threshold 1: $low"
          stale=$(run nep141:wrap.near 0 --stale); echo "stale intent: $stale"
          C=jurat:jurat.near:0:0707070707070707
          bound=$(run nep141:wrap.near 0 --challenge=$C); echo "bound to challenge: $bound"
          other=$(run nep141:wrap.near 0 --challenge=$C --sign-for=jurat:jurat.near:1:0707070707070707); echo "signed for another: $other"

          test "$(jq -r .result <<<"$ok")" = confirmed
          test "$(jq -r .result <<<"$low")" = not_confirmed
          test "$(jq -r .result <<<"$stale")" = refused
          test "$(jq -r .auth_status <<<"$stale")" = 401
          test "$(jq -r .result <<<"$bound")" = confirmed
          test "$(jq -r .challenge <<<"$bound")" = "$C"
          test "$(jq -r .result <<<"$other")" = refused
          test "$(jq -r .auth_status <<<"$other")" = null

      - uses: actions/upload-artifact@v4
        with:
          name: jurat-enclave-wasm
          path: |
            target/wasm32-wasip2/release/jurat-enclave.wasm
            wasm.sha256

  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Statement contract unit tests
        run: cargo test --locked
