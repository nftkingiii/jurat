[package]
name = "jurat-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
description = "Jurat: public statements about NEAR confidential balances, proved inside OutLayer"
license = "MIT"
repository = "https://github.com/nftkingiii/jurat"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
serde_json = "1.0"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.93.0"
image_digest = ""
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Its own workspace: the enclave builds for wasm32-wasip2 with rust 1.85,
# the contract for NEAR with rust 1.93+.
[workspace]
